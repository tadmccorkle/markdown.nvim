name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  commit_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: webiny/action-conventional-commits@v1.3.0

  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v0.10.4
            treesitter: v0.25.10
          - version: v0.11.7
            treesitter: v0.25.10
          - version: stable
            treesitter: v0.26.13
    uses: ./.github/workflows/tests.yml
    with:
      version: ${{ matrix.version }}
      treesitter: ${{ matrix.treesitter }}
